name: Tests du jeu

# Lance les tests hors écran du jeu Godot (dossier game/) à chaque modification.
# Indépendant de release.yml, qui publie encore l'application Electron v1.

on:
  push:
    paths:
      - 'game/**'
      - '.github/workflows/game-tests.yml'
  pull_request:
    paths:
      - 'game/**'
      - '.github/workflows/game-tests.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Télécharger Godot
        run: |
          curl -sSfL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot

      - name: Lancer les tests
        # `timeout` : hors écran, Godot ne se ferme pas si un script plante avant quit().
        run: timeout 180 ./godot --headless --path game --script res://tests/run_tests.gd
